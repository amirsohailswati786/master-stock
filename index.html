<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>Stock</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f1f5f4;color:#0f172a;padding-bottom:70px}
header{background:#0f766e;color:#fff;padding:12px 14px;font-weight:700}main{padding:10px;max-width:760px;margin:auto}
.c{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px #0002;overflow-x:auto}
input,select,button{font:inherit;padding:9px;border:1px solid #cbd5d1;border-radius:8px;width:100%;margin:3px 0}
button{background:#0f766e;color:#fff;border:0;font-weight:600}button.g{background:#64748b}button.d{background:#b91c1c;width:auto;padding:2px 8px;margin:0}button.b{background:#0369a1;width:auto;padding:2px 8px;margin:0}
.r{display:flex;gap:6px;flex-wrap:wrap}.r>*{flex:1}.r>button.g,.r>button.k{flex:none;width:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccc}
nav a{flex:1;text-align:center;padding:10px 2px;font-size:12px;color:#475569}nav a.on{color:#0f766e;font-weight:700;border-top:3px solid #0f766e}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #e2e8f0;padding:5px;text-align:left}th{background:#e6f2f0}.n{text-align:right}.t td{font-weight:700;background:#f0fdfa}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}#ov>div{background:#fff;padding:16px;border-radius:12px;width:90%;max-width:340px}
@media print{body *{visibility:hidden}#rp,#rp *{visibility:visible}#rp{position:absolute;left:0;top:0;width:100%;box-shadow:none}}
</style></head><body>
<header id="h"></header><main id="v"></main><nav id="nv"></nav>
<div id="ov"><div><p id="om"></p><input id="oi" type="password"><button id="ob">OK</button></div></div>
<script>
const CFG={mode:"master"};
const $=i=>document.getElementById(i),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2}),td=()=>new Date().toISOString().slice(0,10),h=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return''+x},
LS=localStorage,K='stk_'+(CFG.id||'master');
let D=JSON.parse(LS[K]||'null')||{items:[],acc:[],sale:[],pur:[],vou:[],co:'',bn:{sale:0,pur:0}},N=+LS[K+'n']||0,U=LS[K+'u']=='1',S={t:'st',at:'',rt:'sp',rid:'',f:'',to:'',e:null,bill:null};
const sv=()=>LS[K]=JSON.stringify(D),co=()=>CFG.cn||D.co||'',
AT={D:'Debtor',C:'Creditor',B:'Bank',E:'Expense',O:'Company (Owner)'},
T=[['st','Stock'],['sale','Sale'],['pur','Purchase'],['ac','Accounts'],['rp','Reports'],['se','Settings']],
gi=i=>D.items.find(x=>x.id==i)||{n:'?',c:'',cd:''},ga=i=>D.acc.find(x=>x.id==i)||{n:'?',cd:''},
sm=(L,k)=>L.reduce((s,x)=>s+(+x[k]),0),pq=i=>sm(D.pur.filter(x=>x.i==i),'q'),sq=i=>sm(D.sale.filter(x=>x.i==i),'q'),
bal=i=>(+gi(i).o||0)+pq(i)-sq(i),amt=L=>L.reduce((s,x)=>s+x.q*x.r,0),
opt=(L,sel,fn)=>L.map(x=>`<option value="${x.id}"${sel==x.id?' selected':''}>${fn(x)}</option>`).join(''),
ed=k=>S.e&&S.e.k==k?S.e:null;
function ask(m,cb,t){$('om').textContent=m;$('oi').value='';$('oi').type=t||'password';$('ov').style.display='flex';$('ob').onclick=()=>{const v=$('oi').value;$('ov').style.display='none';cb(v)}}
function chk(){if(CFG.mode=='copy'&&!U&&N>=20){ask('Trial finished (20 entries). Enter unlock password:',v=>{if(h(v)==CFG.ph){U=1;LS[K+'u']=1;r()}else alert('Wrong password')});return 0}return 1}
function ok(){if(!chk())return 0;N++;LS[K+'n']=N;return 1}
function led(a){const R=[];D.sale.filter(x=>x.p==a).forEach(x=>R.push([x.d,'Sale '+gi(x.i).n+' '+x.q+'@'+x.r,x.q*x.r,0]));D.pur.filter(x=>x.p==a).forEach(x=>R.push([x.d,'Purchase '+gi(x.i).n+' '+x.q+'@'+x.r,0,x.q*x.r]));D.vou.filter(x=>x.a==a).forEach(x=>R.push([x.d,x.n||'Voucher',x.t=='dr'?x.m:0,x.t=='cr'?x.m:0]));return R.sort((a,b)=>a[0]<b[0]?-1:1)}
const ab=a=>led(a).reduce((s,x)=>s+x[2]-x[3],0);
function r(){$('h').textContent=co()+(CFG.mode=='copy'?'':(co()?' · ':'')+'MASTER');$('nv').innerHTML=T.map(x=>`<a class="${S.t==x[0]?'on':''}" onclick="S.t='${x[0]}';S.e=null;S.bill=null;r()">${x[1]}</a>`).join('');$('v').innerHTML=S.bill?vBill():({st:vSt,sale:()=>vTx('sale'),pur:()=>vTx('pur'),ac:vAc,rp:vRp,se:vSe})[S.t]()}
const cx=k=>ed(k)?'<button class="g" onclick="S.e=null;r()">Cancel</button>':'';
function vSt(){const x=ed('i')?gi(S.e.id):{},cats=[...new Set(D.items.map(x=>x.c).filter(Boolean))];return `<div class="c"><b>${x.id?'Edit Item':'New Item'}</b><input id="ic" placeholder="Code *" value="${e(x.cd)}"><input id="in" placeholder="Name *" value="${e(x.n)}"><input id="ig" placeholder="Category" list="cl" value="${e(x.c)}"><datalist id="cl">${cats.map(c=>`<option value="${e(c)}">`).join('')}</datalist><input id="io" type="number" placeholder="Opening Qty" value="${e(x.o)}"><button onclick="addI()">${x.id?'Update':'Save'}</button>${cx('i')}</div>
<div class="c"><table><tr><th>Code</th><th>Item</th><th>Category</th><th class="n">Qty</th><th></th></tr>${D.items.map(x=>`<tr><td>${e(x.cd)}</td><td>${e(x.n)}</td><td>${e(x.c)}</td><td class="n">${f(bal(x.id))}</td><td><button class="b" onclick="S.e={k:'i',id:${x.id}};r();scrollTo(0,0)">Edit</button> <button class="d" onclick="delI(${x.id})">x</button></td></tr>`).join('')}</table></div>`}
function addI(){const cd=$('ic').value.trim(),n=$('in').value.trim(),u=ed('i')?S.e.id:0;if(!cd||!n)return alert('Code and Name are required');if(D.items.some(x=>x.cd==cd&&x.id!=u))return alert('Code already exists');if(!chk())return;const o={cd,n,c:$('ig').value.trim(),o:+$('io').value||0};if(u){Object.assign(gi(u),o);S.e=null}else D.items.push(Object.assign({id:Date.now()},o));sv();r()}
function delI(i){if(D.sale.concat(D.pur).some(x=>x.i==i))return alert('This item has entries');if(chk()&&confirm('Delete?')){D.items=D.items.filter(x=>x.id!=i);sv();r()}}
function vTx(k){const x=ed('t')&&S.e.t==k?D[k].find(z=>z.id==S.e.id)||{}:{},L=D[k].slice().sort((a,b)=>a.d<b.d?1:-1);return `<div class="c"><b>${x.id?'Edit ':'New '}${k=='sale'?'Sale':'Purchase'}</b><input id="td" type="date" value="${x.d||td()}"><select id="tp"><option value="">Party *</option>${opt(D.acc.filter(a=>a.t=='D'||a.t=='C'),x.p,a=>e(a.cd)+' '+e(a.n))}</select><select id="ti"><option value="">Item *</option>${opt(D.items,x.i,i=>e(i.cd)+' '+e(i.n))}</select><div class="r"><input id="tq" type="number" placeholder="Qty" value="${e(x.q)}"><input id="tr" type="number" placeholder="Rate" value="${e(x.r)}"></div><button onclick="addT('${k}')">${x.id?'Update':'Save'}</button>${cx('t')}</div>
<div class="c"><table><tr><th>Date</th><th>Party</th><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th><th></th></tr>${L.map(x=>`<tr><td>${x.d}</td><td>${e(ga(x.p).n)}</td><td>${e(gi(x.i).n)}</td><td class="n">${f(x.q)}</td><td class="n">${f(x.r)}</td><td class="n">${f(x.q*x.r)}</td><td style="white-space:nowrap"><button class="b" onclick="S.e={k:'t',t:'${k}',id:${x.id}};r();scrollTo(0,0)">Edit</button> <button class="b" onclick="S.bill={k:'${k}',p:${x.p},d:'${x.d}'};r()">Bill</button> <button class="d" onclick="delT('${k}',${x.id})">x</button></td></tr>`).join('')}<tr class="t"><td colspan=3>Total</td><td class="n">${f(sm(L,'q'))}</td><td></td><td class="n">${f(amt(L))}</td><td></td></tr></table></div>`}
function addT(k){const p=$('tp').value,i=$('ti').value,q=+$('tq').value,rt=+$('tr').value,u=ed('t')?S.e.id:0;if(!p||!i||!(q>0)||!(rt>=0)||$('tr').value==='')return alert('Fill all fields');const o={d:$('td').value||td(),p:+p,i:+i,q,r:rt};if(u){if(!chk())return;Object.assign(D[k].find(z=>z.id==u),o);S.e=null}else{if(k=='sale'&&q>bal(i)&&!confirm('Stock is low. Continue?'))return;if(!ok())return;D.bn=D.bn||{sale:0,pur:0};D.bn[k]++;D[k].push(Object.assign({id:Date.now(),no:D.bn[k]},o))}sv();r()}
function delT(k,id){if(chk()&&confirm('Delete?')){D[k]=D[k].filter(x=>x.id!=id);sv();r()}}
function vBill(){const b=S.bill,L=D[b.k].filter(x=>x.p==b.p&&x.d==b.d).sort((a,c)=>a.id-c.id),no=Math.min(...L.map(x=>x.no||0)),pa=ga(b.p),sl=b.k=='sale';return `<div class="c r"><button onclick="window.print()">Save as PDF</button><button class="g" onclick="S.bill=null;r()">Back</button></div>
<div class="c" id="rp"><h2 style="margin:0">${e(co())}</h2><h3>${sl?'SALE BILL':'PURCHASE BILL'}</h3><p>Bill No: ${sl?'S-':'P-'}${String(no).padStart(3,'0')}<br>Date: ${b.d}<br>${sl?'Customer':'Supplier'}: ${e(pa.n)} (${e(pa.cd)})</p><table><tr><th>#</th><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>${L.map((x,j)=>`<tr><td>${j+1}</td><td>${e(gi(x.i).n)}</td><td class="n">${f(x.q)}</td><td class="n">${f(x.r)}</td><td class="n">${f(x.q*x.r)}</td></tr>`).join('')}<tr class="t"><td colspan=2>Total</td><td class="n">${f(sm(L,'q'))}</td><td></td><td class="n">${f(amt(L))}</td></tr></table></div>`}
function vAc(){const A=D.acc.filter(a=>!S.at||a.t==S.at),a0=ed('a')?ga(S.e.id):{},v0=ed('v')?D.vou.find(z=>z.id==S.e.id)||{}:{};return `<div class="c"><b>${a0.id?'Edit Account':'New Account'}</b><input id="ac" placeholder="Code *" value="${e(a0.cd)}"><input id="an" placeholder="Name *" value="${e(a0.n)}"><select id="at">${Object.entries(AT).map(([k,v])=>`<option value="${k}"${a0.t==k?' selected':''}>${v}</option>`).join('')}</select><button onclick="addA()">${a0.id?'Update':'Save'}</button>${cx('a')}</div>
<div class="c"><b>${v0.id?'Edit Voucher':'Voucher'}</b><input id="vd" type="date" value="${v0.d||td()}"><select id="va">${opt(D.acc,v0.a,a=>e(a.cd)+' '+e(a.n))}</select><select id="vt"><option value="dr">Debit (Paid / Expense / Drawing)</option><option value="cr"${v0.t=='cr'?' selected':''}>Credit (Received)</option></select><input id="vm" type="number" placeholder="Amount" value="${e(v0.m)}"><input id="vn" placeholder="Note" value="${e(v0.n)}"><button onclick="addV()">${v0.id?'Update':'Save'}</button>${cx('v')}</div>
<div class="r">${['',...Object.keys(AT)].map(k=>`<button class="${S.at==k?'k':'g'}" onclick="S.at='${k}';r()">${k?AT[k]:'All'}</button>`).join('')}</div>
<div class="c"><table><tr><th>Code</th><th>Name</th><th class="n">Balance</th><th></th></tr>${A.map(a=>{const b=ab(a.id);return `<tr><td>${e(a.cd)}</td><td>${e(a.n)}<br><small>${AT[a.t]}</small></td><td class="n">${f(Math.abs(b))} ${b>=0?'Dr':'Cr'}</td><td style="white-space:nowrap"><button class="b" onclick="S.e={k:'a',id:${a.id}};r();scrollTo(0,0)">Edit</button> <button class="d" onclick="delA(${a.id})">x</button></td></tr>`}).join('')}</table></div>
<div class="c"><b>Recent Vouchers</b><table>${D.vou.slice(-10).reverse().map(x=>`<tr><td>${x.d}</td><td>${e(ga(x.a).n)}</td><td>${x.t=='dr'?'Dr':'Cr'} ${f(x.m)}</td><td style="white-space:nowrap"><button class="b" onclick="S.e={k:'v',id:${x.id}};r();scrollTo(0,0)">Edit</button> <button class="d" onclick="delV(${x.id})">x</button></td></tr>`).join('')}</table></div>`}
function addA(){const cd=$('ac').value.trim(),n=$('an').value.trim(),u=ed('a')?S.e.id:0;if(!cd||!n)return alert('Code and Name are required');if(D.acc.some(x=>x.cd==cd&&x.id!=u))return alert('Code already exists');if(!chk())return;const o={cd,n,t:$('at').value};if(u){Object.assign(ga(u),o);S.e=null}else D.acc.push(Object.assign({id:Date.now()},o));sv();r()}
function delA(a){if(led(a).length)return alert('This account has entries');if(chk()&&confirm('Delete?')){D.acc=D.acc.filter(x=>x.id!=a);sv();r()}}
function addV(){const a=$('va').value,m=+$('vm').value,u=ed('v')?S.e.id:0;if(!a||!(m>0))return alert('Account and Amount are required');const o={d:$('vd').value||td(),a:+a,t:$('vt').value,m,n:$('vn').value.trim()};if(u){if(!chk())return;Object.assign(D.vou.find(z=>z.id==u),o);S.e=null}else{if(!ok())return;D.vou.push(Object.assign({id:Date.now()},o))}sv();r()}
function delV(id){if(chk()&&confirm('Delete?')){D.vou=D.vou.filter(x=>x.id!=id);sv();r()}}
const tb=(L,t)=>`<b>${t}</b><table><tr><th>Date</th><th>Party</th><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>${L.map(x=>`<tr><td>${x.d}</td><td>${e(ga(x.p).n)}</td><td>${e(gi(x.i).n)}</td><td class="n">${f(x.q)}</td><td class="n">${f(x.r)}</td><td class="n">${f(x.q*x.r)}</td></tr>`).join('')}<tr class="t"><td colspan=3>Total</td><td class="n">${f(sm(L,'q'))}</td><td></td><td class="n">${f(amt(L))}</td></tr></table>`;
function vRp(){const o=[['sp','Sale / Purchase'],['st','Stock'],['ct','Category'],['il','Item Ledger'],['al','Account Ledger']],R=S.rt,inR=x=>(!S.f||x.d>=S.f)&&(!S.to||x.d<=S.to),srt=L=>L.slice().sort((a,b)=>a.d<b.d?-1:1);let tt=o.find(x=>x[0]==R)[1],b='';
if(R=='sp'){const s=srt(D.sale.filter(inR)),p=srt(D.pur.filter(inR));b=tb(s,'Sale')+'<br>'+tb(p,'Purchase')+`<p><b>Total Sale Qty: ${f(sm(s,'q'))} | Total Purchase Qty: ${f(sm(p,'q'))}</b></p>`;tt+=' '+(S.f||'')+' to '+(S.to||'')}
if(R=='st')b=`<table><tr><th>Code</th><th>Item</th><th>Category</th><th class="n">Open</th><th class="n">Pur</th><th class="n">Sale</th><th class="n">Bal</th></tr>${D.items.map(i=>`<tr><td>${e(i.cd)}</td><td>${e(i.n)}</td><td>${e(i.c)}</td><td class="n">${f(i.o)}</td><td class="n">${f(pq(i.id))}</td><td class="n">${f(sq(i.id))}</td><td class="n">${f(bal(i.id))}</td></tr>`).join('')}</table>`;
if(R=='ct'){const g={};D.items.forEach(i=>{const c=i.c||'-';g[c]=g[c]||[0,0,0];g[c][0]+=pq(i.id);g[c][1]+=sq(i.id);g[c][2]+=bal(i.id)});b=`<table><tr><th>Category</th><th class="n">Purchased</th><th class="n">Sold</th><th class="n">Balance</th></tr>${Object.entries(g).map(([c,v])=>`<tr><td>${e(c)}</td><td class="n">${f(v[0])}</td><td class="n">${f(v[1])}</td><td class="n">${f(v[2])}</td></tr>`).join('')}</table>`}
if(R=='il'&&S.rid){let bl=+gi(S.rid).o||0;const X=[];D.pur.filter(x=>x.i==S.rid).forEach(x=>X.push([x.d,'Purchase',ga(x.p).n,x.q,0,x.r]));D.sale.filter(x=>x.i==S.rid).forEach(x=>X.push([x.d,'Sale',ga(x.p).n,0,x.q,x.r]));X.sort((a,b)=>a[0]<b[0]?-1:1);tt+=': '+gi(S.rid).n;b=`<table><tr><th>Date</th><th>Type</th><th>Party</th><th class="n">In</th><th class="n">Out</th><th class="n">Rate</th><th class="n">Bal</th></tr><tr><td colspan=6>Opening</td><td class="n">${f(bl)}</td></tr>${X.map(x=>{bl+=x[3]-x[4];return `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${e(x[2])}</td><td class="n">${x[3]?f(x[3]):''}</td><td class="n">${x[4]?f(x[4]):''}</td><td class="n">${f(x[5])}</td><td class="n">${f(bl)}</td></tr>`}).join('')}</table>`}
if(R=='al'&&S.rid){let bl=0;tt+=': '+ga(S.rid).n;b=`<table><tr><th>Date</th><th>Detail</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>${led(+S.rid).map(x=>{bl+=x[2]-x[3];return `<tr><td>${x[0]}</td><td>${e(x[1])}</td><td class="n">${x[2]?f(x[2]):''}</td><td class="n">${x[3]?f(x[3]):''}</td><td class="n">${f(Math.abs(bl))} ${bl>=0?'Dr':'Cr'}</td></tr>`}).join('')}</table>`}
return `<div class="c"><select onchange="S.rt=this.value;S.rid='';r()">${o.map(x=>`<option value="${x[0]}"${R==x[0]?' selected':''}>${x[1]}</option>`).join('')}</select>${R=='il'?`<select onchange="S.rid=this.value;r()"><option value="">Select item *</option>${opt(D.items,S.rid,i=>e(i.cd)+' '+e(i.n))}</select>`:''}${R=='al'?`<select onchange="S.rid=this.value;r()"><option value="">Select account *</option>${opt(D.acc,S.rid,a=>e(a.cd)+' '+e(a.n))}</select>`:''}${R=='sp'?`<div class="r"><input type="date" value="${S.f}" onchange="S.f=this.value;r()"><input type="date" value="${S.to}" onchange="S.to=this.value;r()"></div>`:''}<button onclick="window.print()">Save as PDF</button></div>
<div class="c" id="rp"><h3>${e(co())} - ${e(tt)}</h3>${b}</div>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function vSe(){return `<div class="c">${CFG.mode=='copy'?`<p>Entries used: ${N}${U?' (unlocked)':' of 20'}</p>`:`<b>Company</b><input id="co" value="${e(D.co)}" placeholder="Company name"><button onclick="D.co=$('co').value;sv();r()">Save</button>`}</div>
<div class="c"><b>Backup</b><button onclick="dl('stock-backup-'+td()+'.json',JSON.stringify(D),'application/json')">Download Backup</button><p>Restore from backup file:</p><input type="file" accept=".json" onchange="rs(this)"></div>
${CFG.mode=='master'?`<div class="c"><b>Make a Client Copy</b><input id="cn" placeholder="Client / Company name *"><input id="cp" placeholder="Unlock password *"><button onclick="mk()">Download Copy</button></div>`:''}`}
function rs(inp){const fl=inp.files[0];if(!fl||!chk())return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.items))throw 0;if(!confirm('Current data will be replaced. Continue?'))return;D=Object.assign({items:[],acc:[],sale:[],pur:[],vou:[],co:'',bn:{sale:0,pur:0}},x);sv();r()}catch(_){alert('Invalid file')}};rd.readAsText(fl)}
async function mk(){const cn=$('cn').value.trim(),pw=$('cp').value;if(!cn||pw.length<3)return alert('Name and password (3+ characters) are required');try{const t=await (await fetch(location.href.split('#')[0])).text(),mark='const CFG='+'{mode:"master"};',cfg={mode:'copy',id:Date.now().toString(36),cn,ph:h(pw)};dl('stock-'+cn.replace(/\W+/g,'_')+'.html',t.replace(mark,()=>'const CFG='+JSON.stringify(cfg)+';'),'text/html')}catch(_){alert('Copies can only be made from the online (GitHub) link')}}
function gate(){if(CFG.mode!='master')return r();const p=LS.stk_mpw;$('v').innerHTML='';ask(p?'Master password:':'Create a master password:',v=>{if(!p){if(v.length<3)return gate();LS.stk_mpw=h(v);r()}else if(h(v)==p)r();else gate()})}
gate();
</script></body></html>
